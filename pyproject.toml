[build-system]
requires = ["setuptools>=75,<90", "wheel>=0.44,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "entregacerta-ai"
version = "0.2.0"
description = "Apoio à priorização de acompanhamento de entregas; ambiente e contratos técnicos."
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<4", "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "streamlit>=1.40,<2", "plotly>=5.24,<7", "httpx>=0.27,<1",
  "python-dotenv>=1,<2", "pydantic>=2.8,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "lxml>=5,<8", "setuptools>=75,<90", "wheel>=0.44,<1"]

[project.scripts]
entregacerta = "entregacerta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
